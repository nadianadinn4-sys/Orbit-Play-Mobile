name: Build Android Remote Play APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbit Play Mobile and Chiaki-ng engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false

      - name: Apply Orbit Play branding and lightweight defaults
        run: python3 .github/scripts/apply-orbit-branding.py

      - name: Build Chiaki-ng Android debug APK
        run: gradle -p chiaki-ng/android assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-play-mobile-chiaki-ng-debug
          path: chiaki-ng/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
